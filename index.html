<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个简洁、易用且支持本地保存的 Todo List。">
  <title>Todo List · 今日清单</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-solid: #ffffff;
      --text: #1f2937;
      --muted: #7b8496;
      --line: #e8eaf0;
      --primary: #6c63ff;
      --primary-dark: #564ee8;
      --primary-soft: #eeecff;
      --danger: #ef6673;
      --shadow: 0 24px 65px rgba(50, 52, 82, 0.13);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 12% 15%, rgba(157, 140, 255, 0.2), transparent 28%),
        radial-gradient(circle at 88% 84%, rgba(103, 211, 195, 0.18), transparent 30%),
        var(--bg);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
      padding: 0 6px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .date {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .panel {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .composer {
      display: flex;
      gap: 12px;
      padding: 24px;
      border-bottom: 1px solid var(--line);
    }

    .composer input, .search input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      outline: none;
      color: var(--text);
      background: var(--surface-solid);
      transition: border-color .2s, box-shadow .2s;
    }

    .composer input {
      height: 52px;
      padding: 0 18px;
      border-radius: 15px;
    }

    .composer input:focus, .search input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }

    .add-button {
      flex: 0 0 auto;
      height: 52px;
      padding: 0 22px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      font-weight: 750;
      background: var(--primary);
      box-shadow: 0 10px 20px rgba(108, 99, 255, 0.24);
      transition: transform .18s, background .18s;
    }

    .add-button:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .add-button:active { transform: translateY(1px); }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
    }

    .filters { display: flex; gap: 5px; }

    .filter-button {
      padding: 8px 12px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 700;
    }

    .filter-button:hover { color: var(--text); background: #f4f5f8; }
    .filter-button.active { color: var(--primary); background: var(--primary-soft); }

    .search { position: relative; width: min(220px, 42%); }
    .search input { height: 38px; padding: 0 13px 0 36px; border-radius: 11px; font-size: 13px; }
    .search svg { position: absolute; top: 11px; left: 12px; width: 16px; color: var(--muted); pointer-events: none; }

    .todo-list { margin: 0; padding: 6px 0; list-style: none; }

    .todo-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 15px 24px;
      animation: item-in .25s ease both;
    }

    .todo-item + .todo-item { border-top: 1px solid var(--line); }
    .todo-item:hover { background: rgba(248, 248, 252, 0.72); }

    @keyframes item-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .check {
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      padding: 0;
      border: 2px solid #d5d8e2;
      border-radius: 8px;
      color: transparent;
      background: #fff;
      transition: .18s;
    }

    .check svg { width: 13px; }
    .todo-item.completed .check { border-color: var(--primary); color: white; background: var(--primary); }

    .todo-text {
      overflow-wrap: anywhere;
      line-height: 1.45;
      transition: color .18s;
    }

    .todo-item.completed .todo-text { color: #a5aab7; text-decoration: line-through; }

    .edit-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--primary);
      border-radius: 9px;
      outline: 3px solid var(--primary-soft);
      color: var(--text);
      background: #fff;
    }

    .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .18s; }
    .todo-item:hover .actions, .actions:focus-within { opacity: 1; }

    .icon-button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
    }

    .icon-button:hover { color: var(--primary); background: var(--primary-soft); }
    .icon-button.delete:hover { color: var(--danger); background: #fff0f2; }
    .icon-button svg { width: 17px; }

    .empty {
      display: none;
      padding: 58px 24px;
      text-align: center;
      color: var(--muted);
    }

    .empty.visible { display: block; }
    .empty-icon { display: grid; width: 56px; height: 56px; margin: 0 auto 14px; place-items: center; border-radius: 18px; color: var(--primary); background: var(--primary-soft); font-size: 25px; }
    .empty p { margin: 0; font-weight: 650; }
    .empty small { display: block; margin-top: 6px; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 60px;
      padding: 14px 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .progress-wrap { display: flex; align-items: center; gap: 11px; }
    .progress { width: 88px; height: 6px; overflow: hidden; border-radius: 99px; background: #eceef3; }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), #8a83ff); transition: width .25s; }

    .clear-button { padding: 7px 9px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: 13px; }
    .clear-button:hover { color: var(--danger); background: #fff0f2; }
    .clear-button:disabled { opacity: .45; cursor: not-allowed; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 600px) {
      body { padding: 28px 12px; }
      .header { align-items: flex-start; flex-direction: column; gap: 10px; }
      .composer { padding: 18px; }
      .add-button { padding: 0 17px; }
      .toolbar { align-items: stretch; flex-direction: column; padding: 14px 18px; }
      .search { width: 100%; }
      .todo-item { padding: 14px 18px; }
      .actions { opacity: 1; }
      .footer { padding: 14px 18px; }
      .progress { width: 60px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">Stay focused</p>
        <h1>今日清单</h1>
      </div>
      <p class="date" id="currentDate"></p>
    </header>

    <section class="panel" aria-label="Todo List 应用">
      <form class="composer" id="todoForm">
        <label class="sr-only" for="todoInput">添加新任务</label>
        <input id="todoInput" type="text" maxlength="120" autocomplete="off" placeholder="接下来要做什么？" required>
        <button class="add-button" type="submit">＋ 添加</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="筛选任务">
          <button class="filter-button active" type="button" data-filter="all">全部</button>
          <button class="filter-button" type="button" data-filter="active">待完成</button>
          <button class="filter-button" type="button" data-filter="completed">已完成</button>
        </div>
        <label class="search">
          <span class="sr-only">搜索任务</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="searchInput" type="search" placeholder="搜索任务…">
        </label>
      </div>

      <ul class="todo-list" id="todoList"></ul>
      <div class="empty" id="emptyState">
        <div class="empty-icon">✓</div>
        <p id="emptyTitle">还没有任务</p>
        <small id="emptyHint">从添加第一件小事开始吧</small>
      </div>

      <footer class="footer">
        <div class="progress-wrap">
          <span id="taskCount">0 项待完成</span>
          <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
        </div>
        <button class="clear-button" id="clearCompleted" type="button">清除已完成</button>
      </footer>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'todo-list-items-v1';
    const todoForm = document.querySelector('#todoForm');
    const todoInput = document.querySelector('#todoInput');
    const todoList = document.querySelector('#todoList');
    const searchInput = document.querySelector('#searchInput');
    const taskCount = document.querySelector('#taskCount');
    const progressBar = document.querySelector('#progressBar');
    const emptyState = document.querySelector('#emptyState');
    const emptyTitle = document.querySelector('#emptyTitle');
    const emptyHint = document.querySelector('#emptyHint');
    const clearCompleted = document.querySelector('#clearCompleted');
    const filterButtons = [...document.querySelectorAll('.filter-button')];

    let todos = loadTodos();
    let currentFilter = 'all';

    function loadTodos() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function makeId() {
      return globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random()}`;
    }

    function escapeHtml(value) {
      const node = document.createElement('div');
      node.textContent = value;
      return node.innerHTML;
    }

    function getVisibleTodos() {
      const keyword = searchInput.value.trim().toLocaleLowerCase('zh-CN');
      return todos.filter(todo => {
        const matchesFilter = currentFilter === 'all' ||
          (currentFilter === 'active' && !todo.completed) ||
          (currentFilter === 'completed' && todo.completed);
        return matchesFilter && todo.text.toLocaleLowerCase('zh-CN').includes(keyword);
      });
    }

    function render() {
      const visibleTodos = getVisibleTodos();
      todoList.innerHTML = visibleTodos.map(todo => `
        <li class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
          <button class="check" type="button" data-action="toggle" aria-label="${todo.completed ? '标记为待完成' : '标记为已完成'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 4 4L19 7"></path></svg>
          </button>
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <div class="actions">
            <button class="icon-button" type="button" data-action="edit" aria-label="编辑任务" title="编辑">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></svg>
            </button>
            <button class="icon-button delete" type="button" data-action="delete" aria-label="删除任务" title="删除">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path></svg>
            </button>
          </div>
        </li>
      `).join('');

      const remaining = todos.filter(todo => !todo.completed).length;
      const completed = todos.length - remaining;
      taskCount.textContent = `${remaining} 项待完成`;
      progressBar.style.width = todos.length ? `${Math.round(completed / todos.length * 100)}%` : '0%';
      clearCompleted.disabled = completed === 0;

      emptyState.classList.toggle('visible', visibleTodos.length === 0);
      if (searchInput.value.trim()) {
        emptyTitle.textContent = '没有匹配的任务';
        emptyHint.textContent = '换一个关键词试试看';
      } else if (currentFilter === 'completed') {
        emptyTitle.textContent = '暂无已完成任务';
        emptyHint.textContent = '完成的任务会显示在这里';
      } else if (currentFilter === 'active' && todos.length > 0) {
        emptyTitle.textContent = '任务全部完成了';
        emptyHint.textContent = '做得漂亮，休息一下吧';
      } else {
        emptyTitle.textContent = '还没有任务';
        emptyHint.textContent = '从添加第一件小事开始吧';
      }
    }

    function startEditing(item, todo) {
      const textNode = item.querySelector('.todo-text');
      const input = document.createElement('input');
      input.className = 'edit-input';
      input.value = todo.text;
      input.maxLength = 120;
      textNode.replaceWith(input);
      input.focus();
      input.select();

      let committed = false;
      const finish = (save) => {
        if (committed) return;
        committed = true;
        const value = input.value.trim();
        if (save && value) {
          todo.text = value;
          saveTodos();
        }
        render();
      };

      input.addEventListener('blur', () => finish(true));
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') finish(true);
        if (event.key === 'Escape') finish(false);
      });
    }

    todoForm.addEventListener('submit', event => {
      event.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;
      todos.unshift({ id: makeId(), text, completed: false, createdAt: Date.now() });
      todoInput.value = '';
      saveTodos();
      render();
      todoInput.focus();
    });

    todoList.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      const item = event.target.closest('.todo-item');
      if (!button || !item) return;
      const todo = todos.find(entry => entry.id === item.dataset.id);
      if (!todo) return;

      if (button.dataset.action === 'toggle') todo.completed = !todo.completed;
      if (button.dataset.action === 'delete') todos = todos.filter(entry => entry.id !== todo.id);
      if (button.dataset.action === 'edit') {
        startEditing(item, todo);
        return;
      }
      saveTodos();
      render();
    });

    filterButtons.forEach(button => button.addEventListener('click', () => {
      currentFilter = button.dataset.filter;
      filterButtons.forEach(item => item.classList.toggle('active', item === button));
      render();
    }));

    searchInput.addEventListener('input', render);
    clearCompleted.addEventListener('click', () => {
      todos = todos.filter(todo => !todo.completed);
      saveTodos();
      render();
    });

    document.querySelector('#currentDate').textContent = new Intl.DateTimeFormat('zh-CN', {
      month: 'long', day: 'numeric', weekday: 'long'
    }).format(new Date());

    render();
  </script>
</body>
</html>
